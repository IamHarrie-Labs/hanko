name: Model-read run

# Once a day, the same watchlist read by the model interpreter instead of the
# word list: a model proposes each reading, code checks it (the token must be
# named in the post, the quoted reason must be verbatim, text aimed at a model
# is dropped), and the reading is frozen into the record so replay never calls
# the model. It costs money per call, so it runs only if the repository has an
# XAI_API_KEY secret, and once a day rather than every few hours.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sealed-sweep
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Is a key configured?
        id: key
        run: |
          if [ -n "$XAI_API_KEY" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "no XAI_API_KEY secret; nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[sealing]"
        if: steps.key.outputs.run == 'true'
      - name: Seal one model-read run
        if: steps.key.outputs.run == 'true'
        env:
          RYO_MCP_URL: ${{ secrets.RYO_MCP_URL }}
          RYO_MCP_KEY: ${{ secrets.RYO_MCP_KEY }}
        run: |
          ls live/runs/run_*.json | sort > "$RUNNER_TEMP/before"
          hanko --root "$RUNNER_TEMP/snapshots" seal \
            --watchlist watchlist.live.json \
            --ledger live/decisions.jsonl \
            --reviews live/reviews.jsonl \
            --samples live/samples.jsonl \
            --manifest-dir live/runs \
            --interpreter llm \
            --lookback-hours 24 \
            --ots \
            --repo-url https://github.com/IamHarrie-Labs/hanko || echo "seal reported a failure; see the manifest"
          ls live/runs/run_*.json | sort | comm -13 "$RUNNER_TEMP/before" - > "$RUNNER_TEMP/new"
          cat "$RUNNER_TEMP/new"
      - name: Verify the new run from its committed files
        if: steps.key.outputs.run == 'true'
        run: |
          test -s "$RUNNER_TEMP/new"
          while read -r manifest; do hanko verify-run "$manifest"; done < "$RUNNER_TEMP/new"
      - name: Summarise for the ledger page
        if: steps.key.outputs.run == 'true'
        run: hanko live-summary --dir live
      - name: Commit
        if: steps.key.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git diff --cached --quiet && exit 0
          git commit -q -m "Sealed model-read run $(basename "$(head -1 "$RUNNER_TEMP/new")" .json)"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          exit 1
