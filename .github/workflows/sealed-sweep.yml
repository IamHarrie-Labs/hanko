name: Sealed sweep

# Every three hours, with no API key: Telegram, Bluesky and RSS voices,
# DexScreener facts and the lexicon reader. Each run is sealed with its
# replay bundle, stamped on OpenTimestamps, and committed to live/, where
# anyone can check it with `hanko verify-run`. If RYO secrets are set on the
# repository they are used; nothing here needs them, and a missing RYO is
# recorded in every decision as a gap rather than hidden.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sealed-sweep
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[sealing]"

      - name: Seal one run
        env:
          RYO_MCP_URL: ${{ secrets.RYO_MCP_URL }}
          RYO_MCP_KEY: ${{ secrets.RYO_MCP_KEY }}
        run: |
          # A token whose decide step failed makes seal exit 1. The run is
          # still sealed and still committed: the failure is in its manifest.
          # A fresh checkout gives every file the same mtime, so the new run
          # is found by comparing the list before and after, not by ls -t.
          ls live/runs/run_*.json | sort > "$RUNNER_TEMP/before"
          hanko --root "$RUNNER_TEMP/snapshots" seal \
            --watchlist watchlist.live.json \
            --ledger live/decisions.jsonl \
            --reviews live/reviews.jsonl \
            --samples live/samples.jsonl \
            --manifest-dir live/runs \
            --interpreter lexicon \
            --lookback-hours 24 \
            --ots \
            --repo-url https://github.com/IamHarrie-Labs/hanko || echo "seal reported a failure; see the manifest"
          ls live/runs/run_*.json | sort | comm -13 "$RUNNER_TEMP/before" - > "$RUNNER_TEMP/new"
          cat "$RUNNER_TEMP/new"

      - name: Verify the new run from its committed files
        run: |
          test -s "$RUNNER_TEMP/new"
          while read -r manifest; do hanko verify-run "$manifest"; done < "$RUNNER_TEMP/new"

      - name: Upgrade pending timestamps
        run: |
          for proof in live/runs/*.ots runs/*.ots; do
            hanko ots-status --upgrade "$proof" || true
          done

      - name: Summarise for the ledger page
        run: hanko live-summary --dir live

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live runs
          git diff --cached --quiet && exit 0
          git commit -q -m "Sealed run $(basename "$(head -1 "$RUNNER_TEMP/new")" .json)"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          exit 1
