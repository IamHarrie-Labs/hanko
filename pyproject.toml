[project]
name = "hanko"
version = "0.1.0"
description = "An agent that files receipts: auditable decisions, pre-registered falsification, and deterministic replay, for the RYO-CHAN platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hanko = "hanko.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
