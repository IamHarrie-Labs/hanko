[project]
name = "ryo-brain"
version = "0.1.0"
description = "Auditable evidence ingestion and deterministic snapshot replay for RYO-CHAN agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ryo = "ryo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
